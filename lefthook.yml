pre-commit:
  parallel: true
  commands:
    eslint:
      # package.json lint / eslint.config.js lintedFiles 와 동일한 범위만 돌린다.
      # examples/** 전체면 resident-tree 등 type-aware 프로젝트 밖 파일이 깨진다.
      glob:
        - 'packages/rustra/src/**/*.ts'
        - 'scripts/**/*.ts'
        - 'examples/calculator/**/*.ts'
        - 'examples/crud/**/*.ts'
        - 'examples/auth/**/*.ts'
        - 'examples/streaming/**/*.ts'
        - 'examples/tauri-calculator/**/*.ts'
        - 'examples/reference-app/**/*.ts'
        - 'examples/react-native-bare-calculator/**/*.ts'
        - 'examples/rn-wasm-spike/**/*.ts'
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{ts,js,json,yml,md}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    rustfmt:
      glob: '*.rs'
      run: PATH="$HOME/.cargo/bin:$PATH" rustfmt --edition 2024 -- {staged_files}
      stage_fixed: true

# pre-push — 포맷/lint만 검증하던 pre-commit 과 달리 컴파일·유닛 신호를
# push 직전에 게이트해 "push 후 수 분 뒤 CI 실패" 피드백 루프를 끊는다.
# test:fast 는 cargo check --workspace --exclude unikit-tauri-calculator 로
# Tauri 시스템 의존성 없이 모든 플랫폼(Linux 포함)에서 통과하도록 맞춰져
# 있어 훅이 플랫폼을 가리지 않는다. 우산 스크립트 드리프트 방지(CI ts-checks
# 선두의 동일 스모크)와도 한 쌍이다.
pre-push:
  commands:
    fast-signal:
      run: bun run test:fast
