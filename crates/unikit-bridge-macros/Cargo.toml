[package]
name = "unikit-bridge-macros"
description.workspace = true
repository.workspace = true
# documentation 미상속 — proc-macro 은 docs.rs 문서 페이지가 없다
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
version.workspace = true

# 워크스페이스 공용 lints(clippy::unwrap_used/expect_used deny) 옵트인.
[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
# path 전용 — doctest(unikit_bridge::prelude 문서 예제)용이다. version을 붙이면
# 발행 매니페스트에 registry 요구로 박혀 `cargo publish -p unikit-bridge-macros`
# 검증 빌드가 아직 registry에 없는 unikit-bridge 를 찾다 실패한다(첫 발행
# 순서는 macros → bridge 이므로 반드시 여기서 깨진다 — 2026-11-16 발행 실패,
# run 43789783109). path 전용 dev-의존은 발행 매니페스트에서 제외된다.
# cargo-deny wildcards=deny 는 [bans] allow-wildcard-paths 로 예외 처리.
unikit-bridge = { path = "../unikit-bridge" }
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
